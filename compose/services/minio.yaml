# ==================== MinIO ====================
# 单独使用：docker compose -f compose/services/minio.yaml --env-file .env --profile minio up -d（推荐用同名 .bat / .sh 脚本）
# 由 ../schemes/*.yaml 引用组成不同方案
# 公共配置见 ../base.yaml；挂载文件统一放在仓库根目录的 config/
name: yudao
services:
  minio:
    extends: { file: ../base.yaml, service: base }   # restart、TZ 等公共配置
    container_name: ${PROJECT_NAME:-yudao}-minio
    image: minio/minio:latest
    profiles: ["minio"]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
