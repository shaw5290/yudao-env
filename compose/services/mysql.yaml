# ==================== MySQL 8.0（核心） ====================
# 单独使用：docker compose -f compose/services/mysql.yaml --env-file .env up -d（推荐用 compose\yudao.bat 菜单）
# 由 ../schemes/*.yaml 引用组成不同方案
# 公共配置见 ../base.yaml；挂载文件统一放在仓库根目录的 config/
name: yudao
services:
  mysql:
    extends: { file: ../base.yaml, service: base }   # restart、TZ 等公共配置
    container_name: ${PROJECT_NAME:-yudao}-mysql
    image: mysql:8.0.21
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../config/mysql/conf:/etc/mysql/conf.d:rw
      - mysql-log:/var/log
      - ../../config/mysql/initdb:/docker-entrypoint-initdb.d:ro    # ← 新增
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    command:
      mysqld
        --character-set-server=utf8mb4
        --collation-server=utf8mb4_general_ci
        --explicit_defaults_for_timestamp=true
        --lower_case_table_names=1
        --max_allowed_packet=128M
        --max_connections=2000
        --wait_timeout=20000
        --skip-name-resolve

volumes:
  mysql-data:
  mysql-log:
