# ==================== TDengine（IoT 模块设备时序数据） ====================
# 单独使用：docker compose -f compose/services/tdengine.yaml --env-file .env --profile tdengine up -d（推荐用同名 .bat / .sh 脚本）
# 由 ../schemes/*.yaml 引用组成不同方案
# 公共配置见 ../base.yaml；挂载文件统一放在仓库根目录的 config/
name: yudao
services:
  # 默认账号密码固定为 root/taosdata（镜像不支持通过环境变量修改），对应 ${TDENGINE_USERNAME}/${TDENGINE_PASSWORD}
  tdengine:
    extends: { file: ../base.yaml, service: base }   # restart、TZ 等公共配置
    container_name: ${PROJECT_NAME:-yudao}-tdengine
    image: tdengine/tdengine:3.3.6.0
    profiles: ["tdengine"]
    ports:
      - "${TDENGINE_PORT:-6041}:6041"   # taosAdapter REST/WebSocket，IoT 模块 jdbc:TAOS-WS:// 连的就是这个端口
      - "6030:6030"                      # taosd 原生连接端口
    environment:
      TAOS_FQDN: tdengine
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos

volumes:
  tdengine-data:
  tdengine-log:
