# ==================== portal（内网服务引导页 / 导航页）====================
# 由 ../kustomization.yaml 引用；把 GitOps 环境的地址、账号、口令、换网说明集中到一个页面
# 单独占用 hostPort 8080：80 已被 GitOps 发布的 admin-vben 占用，不动它，避免前端不可达
# 页面内容放在 config/portal/index.html，由 configMapGenerator 生成带哈希的 ConfigMap；
#   内容变化 -> ConfigMap 名变化 -> Deployment 自动滚动更新，不需要改镜像或手动重启
# 页面里所有链接用 window.location.hostname 动态生成：换网后只要用新 IP 打开本页，链接自动跟随
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels:
    app: portal
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine   # 与 admin-vben 运行时同款，节点已缓存，离线也能起
          ports:
            - name: http
              containerPort: 80
              hostPort: 8080          # 对外 http://<节点IP>:8080/ 与 http://10.10.10.10:8080/
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            # 只覆盖默认首页，nginx 自带的 50x.html 等文件保持原样
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: portal-html   # kustomize 会自动补上 configMapGenerator 生成的哈希后缀
---
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  selector:
    app: portal
  ports:
    - name: http
      port: 80
      targetPort: 80
