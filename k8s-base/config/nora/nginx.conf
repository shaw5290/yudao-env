# ==================== 【已停用 / 留档】NORA 前置 nginx ====================
# 2026-11-14 起 nora 改为单容器直出（NORA_PORT=4000 + hostPort 4000），本文件不再被任何资源引用；
# kustomization.yaml 已删除 nora-nginx configMapGenerator。保留仅供回溯排查过程，不要重新启用。
# 原用途：由 configMapGenerator 挂到 /etc/nginx/nginx.conf
# 背景：NORA 1.4.4 只提供纯 HTTP，早期 `docker push` 卡在
#   Head "https://.../manifests/...": timeout awaiting response headers；
#   当时加本反代，想让 HTTPS 探测被快速拒绝后回退到 HTTP。
#
# 2026-11-14 复核结论：这个 sidecar **不是必需的**：
#   - 真正让推送跑通的是工作流改用 buildx `registry.insecure=true`，BuildKit 直接走 HTTP，不探测 HTTPS；
#   - 经 nginx 4000 与直连 NORA 4001 的 TLS 探测都在约 2.5ms 快速失败，两者无差异；
#   - 绕过 nginx 直推 PodIP:4001 实测 4.8s 成功，NORA 单容器即可承接 Registry v2 推送。
#
# 改造已完成：services/nora.yaml 里 NORA_PORT=4000、containerPort/hostPort=4000、nginx 容器已删；
#   对外地址仍是 10.10.10.10:4000，GitOps 清单与镜像名都没改，Pod 为 1/1。
# 原形态：同 Pod 共享网络命名空间，nginx 监听 4000 转发到 NORA 的 4001。
events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 4000;
    server_name _;

    # 镜像 blob 可能很大，且不落盘缓冲，避免上传超时/占满磁盘
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass http://127.0.0.1:4001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
