# yudao 应用日志的 Logstash pipeline
# 应用通过 logstash-logback-encoder 以 JSON 格式（每行一条）发送到 tcp 5044 端口，
# 字段包括 @timestamp、level、logger_name、thread_name、message、stack_trace、traceId、spanId、app_name、env 等
input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"] # compose / k8s 中的服务名
    index => "yudao-logs-%{+YYYY.MM.dd}" # 按天建索引，Kibana 中使用 yudao-logs-* 查询
  }
}
