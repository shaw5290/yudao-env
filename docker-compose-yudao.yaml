name: yudao
services:
  mysql:
    container_name: ${PROJECT_NAME:-yudao}-mysql
    image: mysql:8.0.21
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d:rw
      - mysql-log:/var/log
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro    # ← 新增
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    command:
      mysqld
        --character-set-server=utf8mb4
        --collation-server=utf8mb4_general_ci
        --explicit_defaults_for_timestamp=true
        --lower_case_table_names=1
        --max_allowed_packet=128M
        --max_connections=2000
        --wait_timeout=20000
        --skip-name-resolve

  redis:
    container_name: ${PROJECT_NAME:-yudao}-redis
    image: redis:7
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]

  # ==================== 以下均需 --profile 才启动 ====================

  nginx:
    container_name: ${PROJECT_NAME:-yudao}-nginx
    image: nginx:latest
    restart: always
    profiles: ["nginx"]
    ports:
      - "${NGINX_PORT:-80}:80"

  # ==================== Nacos 3.x（控制台端口 8080）====================
  nacos:
    container_name: ${PROJECT_NAME:-yudao}-nacos
    image: nacos/nacos-server:v3.0.3
    restart: always
    profiles: ["nacos"]
    depends_on:
      - mysql
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_CONSOLE_PORT:-8080}:8080"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_GRPC_PORT_2:-9849}:9849"
    privileged: true
    environment:
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_MS: 64m
      JVM_MMS: 64m
      MODE: standalone
      NACOS_REPLICAS: 1
      PREFER_HOST_MODE: ip
      NACOS_SERVER_IP: 127.0.0.1
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB_NAME:-nacos}
      MYSQL_SERVICE_USER: ${NACOS_DB_USER:-nacos}
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:-123456}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-MVykIz83uHdNY7BAZWAC23eDPLVLDqaFBft1EOsmqFE=}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-yudao}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-yudao}
      NACOS_AUTH_USER_AGENT_AUTH_WHITE_ENABLE: 1
    volumes:
      - nacos-logs:/home/nacos/logs
      - nacos-plugins:/home/nacos/plugins
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nacos/actuator/health"]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s

  # ==================== TDengine（IoT 模块设备时序数据）====================
  # 默认账号密码固定为 root/taosdata（镜像不支持通过环境变量修改），对应 ${TDENGINE_USERNAME}/${TDENGINE_PASSWORD}
  tdengine:
    container_name: ${PROJECT_NAME:-yudao}-tdengine
    image: tdengine/tdengine:3.3.6.0
    restart: always
    profiles: ["tdengine"]
    ports:
      - "${TDENGINE_PORT:-6041}:6041"   # taosAdapter REST/WebSocket，IoT 模块 jdbc:TAOS-WS:// 连的就是这个端口
      - "6030:6030"                      # taosd 原生连接端口
    environment:
      TZ: Asia/Shanghai
      TAOS_FQDN: tdengine
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos

  jenkins:
    container_name: ${PROJECT_NAME:-yudao}-jenkins
    image: jenkins/jenkins:lts
    restart: always
    user: root
    profiles: ["jenkins"]
    ports:
      - "${JENKINS_PORT:-8089}:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: >-
        -Xms1g -Xmx2g
        -XX:+UseG1GC
        -Dhudson.model.LoadStatistics.clock=1000
        -Dhudson.model.LoadStatistics.decay=0.1
        -Djava.awt.headless=true
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker

  postgres:
    container_name: ${PROJECT_NAME:-yudao}-postgres
    image: postgres:16-alpine
    restart: always
    profiles: ["postgres"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-log:/var/log/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro   # 首次初始化（空卷）时执行，建库 ruoyi-vue-pro 并导入表结构
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    container_name: ${PROJECT_NAME:-yudao}-minio
    image: minio/minio:latest
    restart: always
    profiles: ["minio"]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  rocketmq-namesrv:
    container_name: ${PROJECT_NAME:-yudao}-rocketmq-namesrv
    image: apache/rocketmq:5.3.1
    restart: always
    profiles: ["rocketmq"]
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    container_name: ${PROJECT_NAME:-yudao}-rocketmq-broker
    image: apache/rocketmq:5.3.1
    restart: always
    profiles: ["rocketmq"]
    depends_on:
      - rocketmq-namesrv
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_VIP_PORT:-10909}:10909"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    volumes:
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
      - ./rocketmq/broker/conf/broker.conf:/home/rocketmq/conf/broker.conf

  rabbitmq:
    container_name: ${PROJECT_NAME:-yudao}-rabbitmq
    image: rabbitmq:4.1-management
    restart: always
    profiles: ["rabbitmq"]
    hostname: rabbitmq # 数据目录按节点名（rabbit@<hostname>）存放，固定 hostname 避免容器重建后数据丢失
    ports:
      - "${RABBITMQ_PORT:-5672}:5672" # AMQP
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # 管理控制台
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # ==================== NORA（制品仓库：Docker / Maven / npm）====================
  # 自建镜像 + 代理缓存：Docker 走 /v2/、Maven 走 /maven2/、npm 走 /npm/，Web UI 为 /ui/
  nora:
    container_name: ${PROJECT_NAME:-yudao}-nora
    image: ghcr.io/getnora-io/nora:1.4.4
    restart: always
    profiles: ["nora"]
    stop_grace_period: 30s # 停止时需要刷新审计日志和 token 使用记录，默认 10s 会被提前杀掉
    ports:
      - "${NORA_PORT:-4000}:4000"   # Docker / Maven / npm / Web UI 共用一个端口
    environment:
      TZ: Asia/Shanghai
      NORA_HOST: 0.0.0.0
      NORA_PORT: 4000
      NORA_PUBLIC_URL: ${NORA_PUBLIC_URL:-http://localhost:${NORA_PORT:-4000}}   # npm tarball 等下载地址的前缀，必须是客户端可访问的地址
      NORA_REGISTRIES_ENABLE: docker,maven,npm   # 只启用这三种仓库
      NORA_CURATION_MODE: "off"   # 不审查上游包；1.5.0 起代理仓库必须显式设置该项
      NORA_MAVEN_PROXIES: ${NORA_MAVEN_PROXIES:-https://maven.aliyun.com/repository/public,https://repo1.maven.org/maven2}
      NORA_NPM_PROXY: ${NORA_NPM_PROXY:-https://registry.npmmirror.com}
      NORA_DOCKER_PROXIES: ${NORA_DOCKER_PROXIES:-https://registry-1.docker.io}
      NORA_AUTH_ENABLED: ${NORA_AUTH_ENABLED:-false}
      NORA_AUTH_ANONYMOUS_READ: ${NORA_AUTH_ANONYMOUS_READ:-true}     # 开启鉴权后 Maven / npm 仍可匿名下载
      NORA_AUTH_DOCKER_ANON_PULL: ${NORA_AUTH_DOCKER_ANON_PULL:-true} # 开启鉴权后镜像仍可匿名拉取（K8s 节点拉镜像不用配凭据）
      NORA_AUTH_HTPASSWD_FILE: /etc/nora/auth/users.htpasswd          # 开启鉴权时才读取
    volumes:
      - nora-data:/data
      - ./nora/auth:/etc/nora/auth:ro

  xxl-job-admin:
    container_name: ${PROJECT_NAME:-yudao}-xxl-job-admin
    image: xuxueli/xxl-job-admin:2.4.1
    restart: always
    profiles: ["xxl-job"]
    depends_on:
      - mysql
    ports:
      - "${XXL_JOB_PORT:-9090}:8080"
    environment:
      TZ: Asia/Shanghai
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/${XXL_JOB_DB_NAME:-xxl_job}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-123456}
    volumes:
      - xxl-job-logs:/data/applogs

  seata-server:
    container_name: ${PROJECT_NAME:-yudao}-seata-server
    image: apache/seata-server:2.5.0   # 与 yudao-cloud 的 Seata 客户端版本（spring-cloud-alibaba-dependencies 管理）保持一致
    restart: always
    profiles: ["seata"]
    depends_on:
      - nacos
      - mysql
    ports:
      - "${SEATA_PORT:-8091}:8091"
      - "${SEATA_DASHBOARD_PORT:-7091}:7091"
    environment:
      SEATA_IP: ${SEATA_IP:-127.0.0.1}   # 注册到 Nacos 的地址，宿主机上的服务通过它连接 TC
      SEATA_PORT: 8091
      SEATA_DB_PASSWORD: ${SEATA_DB_PASSWORD:-123456}   # 与 mysql/initdb/01-create-databases.sql 的 seata 用户一致
      SEATA_NACOS_USERNAME: ${NACOS_USERNAME:-}   # Nacos 开启鉴权时填写
      SEATA_NACOS_PASSWORD: ${NACOS_PASSWORD:-}
    volumes:
      - ./seata/resources/application.yml:/seata-server/resources/application.yml:ro   # 只挂载配置文件，注册中心 / 存储配置见该文件

  sentinel-dashboard:
    container_name: ${PROJECT_NAME:-yudao}-sentinel-dashboard
    image: bladex/sentinel-dashboard:1.8.8
    restart: always
    profiles: ["sentinel"]
    ports:
      - "${SENTINEL_PORT:-8858}:8858"
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    volumes:
      - sentinel-logs:/root/logs

  # Grafana LGTM：OTel Collector + Loki（日志）+ Tempo（链路）+ Prometheus（指标）+ Grafana，一体化可观测性，仅用于开发测试
  # 应用通过 OTLP 上报 trace 与日志，Grafana 中可在链路与日志之间互相跳转；默认账号 admin / admin
  lgtm:
    container_name: ${PROJECT_NAME:-yudao}-lgtm
    image: grafana/otel-lgtm:0.37.0
    restart: always
    profiles: ["lgtm"]
    ports:
      - "${LGTM_GRAFANA_PORT:-3000}:3000"     # Grafana 控制台
      - "${LGTM_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${LGTM_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP（yudao 应用默认上报到这里）
    environment:
      TZ: Asia/Shanghai
    volumes:
      - lgtm-data:/data

  # ELK：Elasticsearch（存储）+ Logstash（采集）+ Kibana（查询），日志聚合，仅用于开发测试
  # 应用以 JSON 格式通过 TCP 发送日志到 Logstash，Kibana 中按 traceId、app_name 等字段查询；已关闭安全认证
  elasticsearch:
    container_name: ${PROJECT_NAME:-yudao}-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    restart: always
    profiles: ["elk"]
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      TZ: Asia/Shanghai
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  logstash:
    container_name: ${PROJECT_NAME:-yudao}-logstash
    image: docker.elastic.co/logstash/logstash:8.19.23
    restart: always
    profiles: ["elk"]
    depends_on:
      - elasticsearch
    ports:
      - "${LOGSTASH_TCP_PORT:-5044}:5044"   # tcp + json_lines（yudao 应用的 yudao.logstash.destination）
    environment:
      TZ: Asia/Shanghai
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro

  kibana:
    container_name: ${PROJECT_NAME:-yudao}-kibana
    image: docker.elastic.co/kibana/kibana:8.19.23
    restart: always
    profiles: ["elk"]
    depends_on:
      - elasticsearch
    ports:
      - "${KIBANA_PORT:-5601}:5601"   # Kibana 控制台
    environment:
      TZ: Asia/Shanghai
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      I18N_LOCALE: zh-CN

volumes:
  mysql-data:
  mysql-log:
  nacos-data:
  nacos-logs:
  nacos-plugins:
  jenkins-home:
  minio-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  rabbitmq-data:
  nora-data:
  xxl-job-logs:
  sentinel-logs:
  tdengine-data:
  tdengine-log:
  postgres-data:
  lgtm-data:
  elasticsearch-data:
  postgres-log:
