apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xxl-job-logs
  namespace: yudao
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xxl-job-admin
  namespace: yudao
  labels:
    app: xxl-job-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xxl-job-admin
  template:
    metadata:
      labels:
        app: xxl-job-admin
    spec:
      containers:
        - name: xxl-job-admin
          image: xuxueli/xxl-job-admin:2.4.1
          ports:
            - containerPort: 8080
              hostPort: 8088   # 对应 .env 的 XXL_JOB_PORT
          env:
            - name: TZ
              value: Asia/Shanghai
            # PARAMS 里要用 $(...) 引用，必须先在 env 里显式声明（不能只靠 envFrom）
            - name: XXL_JOB_DB_NAME
              valueFrom:
                secretKeyRef: { name: yudao-env, key: XXL_JOB_DB_NAME }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: yudao-env, key: MYSQL_ROOT_PASSWORD }
            - name: PARAMS
              value: >-
                --spring.datasource.url=jdbc:mysql://mysql:3306/$(XXL_JOB_DB_NAME)?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false
                --spring.datasource.username=root
                --spring.datasource.password=$(MYSQL_ROOT_PASSWORD)
          volumeMounts:
            - name: logs
              mountPath: /data/applogs
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: xxl-job-logs
---
apiVersion: v1
kind: Service
metadata:
  name: xxl-job-admin
  namespace: yudao
spec:
  selector:
    app: xxl-job-admin
  ports:
    - port: 8080
      targetPort: 8080
