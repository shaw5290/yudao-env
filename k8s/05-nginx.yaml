apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: yudao
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
              hostPort: 80   # 对应 .env 的 NGINX_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: yudao
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
