# ==================== sentinel（每个服务一个文件）====================
# 由 schemes/*/kustomization.yaml 引用组成不同方案；单独部署用 k8s\yudao-k8s.bat 菜单（生成单服务临时方案）
# 不写 namespace，由 ../base 统一添加；挂载仓库文件的 hostPath 指向根目录 config/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-logs
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dashboard
  labels:
    app: sentinel-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-dashboard
  template:
    metadata:
      labels:
        app: sentinel-dashboard
    spec:
      containers:
        - name: sentinel-dashboard
          image: bladex/sentinel-dashboard:1.8.8
          ports:
            - containerPort: 8858
              hostPort: 8858   # 对应 .env 的 SENTINEL_PORT
          env:
            - name: JAVA_OPTS
              value: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
          volumeMounts:
            - name: logs
              mountPath: /root/logs
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: sentinel-logs
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-dashboard
spec:
  selector:
    app: sentinel-dashboard
  ports:
    - port: 8858
      targetPort: 8858
