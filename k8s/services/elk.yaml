# ==================== elk（每个服务一个文件）====================
# 由 schemes/*/kustomization.yaml 引用组成不同方案；单独部署用同名 elk.bat / elk.sh
# 不写 namespace，由 ../base 统一添加；挂载仓库文件的 hostPath 指向根目录 config/
# ELK：Elasticsearch（存储）+ Logstash（采集）+ Kibana（查询），日志聚合，仅用于开发测试；已关闭安全认证
# Logstash 的 pipeline 使用 ConfigMap 内联，内容与 elk/logstash/pipeline/logstash.conf 保持一致
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
          ports:
            - containerPort: 9200
              hostPort: 9200   # 对应 .env 的 ELASTICSEARCH_PORT，冲突时改这里
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elasticsearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
data:
  logstash.conf: |
    input {
      tcp {
        port => 5044
        codec => json_lines
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"] # k8s Service 名
        index => "yudao-logs-%{+YYYY.MM.dd}"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.19.23
          ports:
            - containerPort: 5044
              hostPort: 5044   # 对应 .env 的 LOGSTASH_TCP_PORT
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
            - name: XPACK_MONITORING_ENABLED
              value: "false"
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
spec:
  selector:
    app: logstash
  ports:
    - port: 5044
      targetPort: 5044
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.19.23
          ports:
            - containerPort: 5601
              hostPort: 5601   # 对应 .env 的 KIBANA_PORT
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200   # k8s Service 名
            - name: I18N_LOCALE
              value: zh-CN
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601
