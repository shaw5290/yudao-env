# ==================== 方案：核心服务（菜单 1 / 3 / 6） ====================
# 部署：kubectl --context docker-desktop kustomize --load-restrictor LoadRestrictionsNone k8s/schemes/core | kubectl --context docker-desktop apply -f -
# （引用了目录外的 services/*.yaml，必须加 --load-restrictor LoadRestrictionsNone，所以不能直接 apply -k；推荐用 yudao-k8s 菜单）
# 新方案：复制本目录，增删 resources 中的服务文件即可
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../services/mysql.yaml
  - ../../services/redis.yaml
  - ../../services/nacos.yaml
  - ../../services/tdengine.yaml
  - ../../services/nginx.yaml
components:
  - ../../base   # 公共配置：namespace yudao、公共标签
