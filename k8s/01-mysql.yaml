apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: yudao
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-log
  namespace: yudao
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: yudao
  labels:
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.21
          args:
            - mysqld
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_general_ci
            - --explicit_defaults_for_timestamp=true
            - --lower_case_table_names=1
            - --max_allowed_packet=128M
            - --max_connections=2000
            - --wait_timeout=20000
            - --default-authentication-plugin=mysql_native_password
          ports:
            - containerPort: 3306
              hostPort: 3306   # 对应 .env 的 MYSQL_PORT，冲突时改这里
          envFrom:
            - secretRef:
                name: yudao-env   # 提供 MYSQL_ROOT_PASSWORD，跟镜像原生变量名一致
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: LANG
              value: C.UTF-8
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: log
              mountPath: /var/log
            - name: conf
              mountPath: /etc/mysql/conf.d
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: log
          persistentVolumeClaim:
            claimName: mysql-log
        - name: conf
          hostPath:
            path: /run/desktop/mnt/host/d/sourceCode/yudao/env/mysql/conf
            type: DirectoryOrCreate
        - name: initdb
          hostPath:
            path: /run/desktop/mnt/host/d/sourceCode/yudao/env/mysql/initdb
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: yudao
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
