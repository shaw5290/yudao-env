apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-logs
  namespace: yudao
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dashboard
  namespace: yudao
  labels:
    app: sentinel-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-dashboard
  template:
    metadata:
      labels:
        app: sentinel-dashboard
    spec:
      containers:
        - name: sentinel-dashboard
          image: bladex/sentinel-dashboard:1.8.8
          ports:
            - containerPort: 8858
              hostPort: 8858   # 对应 .env 的 SENTINEL_PORT
          env:
            - name: JAVA_OPTS
              value: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
          volumeMounts:
            - name: logs
              mountPath: /root/logs
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: sentinel-logs
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-dashboard
  namespace: yudao
spec:
  selector:
    app: sentinel-dashboard
  ports:
    - port: 8858
      targetPort: 8858
