apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home
  namespace: yudao
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: yudao
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      securityContext:
        runAsUser: 0   # 对应 compose 的 user: root
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts
          ports:
            - containerPort: 8080
              hostPort: 8080   # 对应 .env 的 JENKINS_PORT
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: JAVA_OPTS
              value: >-
                -Xms1g -Xmx2g
                -XX:+UseG1GC
                -Dhudson.model.LoadStatistics.clock=1000
                -Dhudson.model.LoadStatistics.decay=0.1
                -Djava.awt.headless=true
          volumeMounts:
            - name: home
              mountPath: /var/jenkins_home
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: docker-bin
              mountPath: /usr/bin/docker
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock   # k8s 节点自己的路径，不需要 /run/desktop/mnt/host 前缀
            type: Socket
        - name: docker-bin
          hostPath:
            path: /usr/bin/docker
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: yudao
spec:
  selector:
    app: jenkins
  ports:
    - port: 8080
      targetPort: 8080
