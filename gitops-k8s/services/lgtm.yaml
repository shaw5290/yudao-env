# ==================== lgtm（每个服务一个文件）====================
# 由 ../kustomization.yaml 引用；本目录自包含，供 GitOps（Argo CD / Flux）直接同步，与 k8s/services 分开维护
# 不写 namespace，由 ../kustomization.yaml 统一添加；不使用 hostPath，敏感值来自手工创建的 Secret yudao-env
# Grafana LGTM：OTel Collector + Loki（日志）+ Tempo（链路）+ Prometheus（指标）+ Grafana，仅用于开发测试
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app: lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.37.0
          ports:
            - containerPort: 3000
              hostPort: 3000   # 宿主机端口，冲突时改这里（不读 .env）
            - containerPort: 4317
              hostPort: 4317   # 宿主机端口，冲突时改这里（不读 .env）
            - containerPort: 4318
              hostPort: 4318   # 宿主机端口，冲突时改这里（不读 .env）
          env:
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lgtm-data
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  selector:
    app: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
