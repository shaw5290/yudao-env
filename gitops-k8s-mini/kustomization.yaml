# ==================== GitOps 最小环境：postgresql、redis、rabbitmq、r-nacos、loki、gitea、nora + gitops-sync ====================
# 本文件是 gitops-sync 从 Gitea 拉取后 apply 的入口，首次部署也可手工执行：
#   kubectl --context <集群上下文> apply -k gitops-k8s-mini
# 命名空间、gitops-sync 的 ServiceAccount / RBAC 在 bootstrap/（手工 apply 一次，不参与自动同步）
# Secret yudao-env 不入库，部署前手工创建，见 README.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yudao-mini
labels:
  - pairs:
      app.kubernetes.io/part-of: yudao-env-mini
    includeSelectors: false   # 只加到 metadata，不改 selector（已有 Deployment 的 selector 不可变）
resources:
  - services/postgresql.yaml
  - services/redis.yaml
  - services/rabbitmq.yaml
  - services/r-nacos.yaml
  - services/loki.yaml
  - services/gitea.yaml
  - services/nora.yaml
  - services/gitops-sync.yaml
# 配置文件生成 ConfigMap，名称带内容哈希：文件变化后引用它的 Pod 自动滚动更新
configMapGenerator:
  - name: loki-config
    files:
      - default.yml=config/loki.yml   # 11notes/loki 固定读取 /loki/etc/default.yml
  - name: gitops-sync-script
    files:
      - sync.sh=config/gitops-sync.sh
