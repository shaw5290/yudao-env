# ==================== 集群 dev 的 Flux 同步配置（手工 apply 一次） ====================
#   kubectl --context <dev 集群上下文> apply -k gitops-k8s-mini/clusters/dev
# 前置：已 flux install，并在 flux-system 中创建 Secret gitee-auth（必需）、acr-auth（用 ACR 时），见 ../../README.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gitrepository.yaml
  - sync.yaml
  # - image-automation.yaml   # 有 ACR 应用镜像后启用：自动把新 Tag 写回 Gitee 的 feature/dev
