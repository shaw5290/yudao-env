# ==================== 环境 dev：开发环境集群 ====================
# 由 ../../clusters/dev/sync.yaml（Flux Kustomization）同步；只写本环境与 base 的差异
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yudao-dev   # 命名空间名 = yudao-<环境>（由 ../../bootstrap/dev 创建）；以后转 Helm 时对应 helm -n
resources:
  - ../../base
  - apps/gateway.yaml   # API 网关（hostPort 48080，dev 唯一对外入口）
  - apps/auth.yaml      # 认证服务（微服务，注册 Nacos）
  - apps/system.yaml    # 系统服务（微服务，注册 Nacos）
  - apps/infra.yaml     # 基础设施服务（微服务，注册 Nacos）
  - apps/server.yaml    # 单体聚合服务（禁用 Nacos，仅内部）
# 镜像版本差异示例（ACR 中的应用镜像、或固定中间件版本）：
# images:
#   - name: registry.cn-hangzhou.aliyuncs.com/<ACR 命名空间>/yudao-gateway
#     newTag: "2.6.0"
# 副本数 / 资源等差异用 patches，例如：
# patches:
#   - target: { kind: Deployment, name: loki }
#     patch: |-
#       - op: replace
#         path: /spec/replicas
#         value: 0
