# ==================== 环境 test：测试环境集群 ====================
# 由 ../../clusters/test/sync.yaml（Flux Kustomization）同步；只写本环境与 base 的差异
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yudao-test   # 命名空间名 = yudao-<环境>（由 ../../bootstrap/test 创建）；以后转 Helm 时对应 helm -n
resources:
  - ../../base
