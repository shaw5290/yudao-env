# ==================== 引导资源（手工 apply 一次，不参与自动同步） ====================
#   kubectl --context <集群上下文> apply -k gitops-k8s-mini/bootstrap
# 命名空间和 gitops-sync 的权限放在这里：同步 Job 只拿命名空间内权限，不需要集群级权限，
# 也不会因为一次错误提交把自己的权限删掉
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yudao-mini
labels:
  - pairs:
      app.kubernetes.io/part-of: yudao-env-mini
    includeSelectors: false
resources:
  - namespace.yaml
  - gitops-sync-rbac.yaml
