# ==================== 默认 ServiceAccount：拉取 ACR 私有镜像 ====================
# 本环境命名空间中未指定 serviceAccountName 的 Pod 都用 default，给它挂上 ACR 拉取凭证 acr-auth，
# 清单里就不用逐个写 imagePullSecrets；Secret acr-auth 手工创建（docker-registry 类型），见 ../README.md「ACR」
# acr-auth 不存在时只影响 ACR 私有镜像，Docker Hub 等公开镜像照常拉取
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
imagePullSecrets:
  - name: acr-auth
