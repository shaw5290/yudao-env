# ==================== nora（每个服务一个文件）====================
# 由 ../kustomization.yaml 引用，Flux 从 Gitee 拉取后自动 apply；从 gitops-k8s/services/nora.yaml 复制，两边分开维护
# 不写 namespace，由 ../../overlays/<环境>/kustomization.yaml 统一添加（命名空间 yudao-<环境>）；不使用 hostPath，敏感值来自手工创建的 Secret yudao-env
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nora-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nora
  labels:
    app: nora
spec:
  replicas: 1
  strategy:
    type: Recreate   # 本地存储只允许单写入实例
  selector:
    matchLabels:
      app: nora
  template:
    metadata:
      labels:
        app: nora
    spec:
      terminationGracePeriodSeconds: 30   # 对应 compose 的 stop_grace_period，停止时刷新审计日志和 token 使用记录
      securityContext:
        fsGroup: 101   # 镜像以 nora 用户（uid 100 / gid 101）运行
      containers:
        - name: nora
          image: ghcr.io/getnora-io/nora:1.4.4
          ports:
            - containerPort: 4000
              hostPort: 4000   # 宿主机端口，冲突时改这里（不读 .env）
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: NORA_HOST
              value: 0.0.0.0
            - name: NORA_PORT
              value: "4000"
            - name: NORA_REGISTRIES_ENABLE
              value: docker,maven,npm   # 只启用这三种仓库
            - name: NORA_CURATION_MODE
              value: "off"   # 不审查上游包；1.5.0 起代理仓库必须显式设置该项
            # 以下取自 Secret yudao-env，键名与 NORA 原生变量一致；缺省时使用 NORA 内置默认值
            - name: NORA_PUBLIC_URL
              valueFrom:
                secretKeyRef: { name: yudao-env, key: NORA_PUBLIC_URL, optional: true }
            - name: NORA_MAVEN_PROXIES
              valueFrom:
                secretKeyRef: { name: yudao-env, key: NORA_MAVEN_PROXIES, optional: true }
            - name: NORA_NPM_PROXY
              valueFrom:
                secretKeyRef: { name: yudao-env, key: NORA_NPM_PROXY, optional: true }
            - name: NORA_DOCKER_PROXIES
              valueFrom:
                secretKeyRef: { name: yudao-env, key: NORA_DOCKER_PROXIES, optional: true }
            - name: NORA_AUTH_ENABLED
              value: "false"   # 本环境不开鉴权（固定值，不读 Secret）；任何能访问 4000 端口的人都能推送、上传，只用于内网
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nora-data
---
apiVersion: v1
kind: Service
metadata:
  name: nora
spec:
  selector:
    app: nora
  ports:
    - name: http
      port: 4000
      targetPort: 4000
