# ==================== postgresql（每个服务一个文件）====================
# 由 ../kustomization.yaml 引用，Flux 从 Gitee 拉取后自动 apply；从 gitops-k8s/services/postgres.yaml 复制，两边分开维护
# 不写 namespace，由 ../kustomization.yaml 统一添加（yudao-mini）；不使用 hostPath，敏感值来自手工创建的 Secret yudao-env
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    app: postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              hostPort: 5432   # 宿主机端口，冲突时改这里（不读 .env）
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: POSTGRES_DB
              value: ruoyi-vue-pro   # 首次初始化时直接建业务库（代替 config/postgres/initdb/01）；库名由表结构脚本决定，不放 .env
            # 以下取自 Secret yudao-env，键名与 postgres 镜像原生变量一致
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: yudao-env, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: yudao-env, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
spec:
  selector:
    app: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
